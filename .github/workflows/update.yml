name: 株価データ 自動更新

on:
  schedule:
    # JST = UTC+9 なので UTC で指定
    - cron: '35 2 * * 1-5'   # 平日 JST 11:35
    - cron: '35 6 * * 1-5'   # 平日 JST 15:35
    - cron: '0 9 * * 1-5'    # 平日 JST 18:00
  workflow_dispatch:           # 手動実行も可

# 実行が重なると git push が衝突するため、同時に1つだけ走らせる
concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # git push に必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: pip install yfinance pandas

      # yfinance は一時的にデータ取得に失敗することがあるため最大4回試す
      # アクセス制限が解除されるのを待つため、間隔を 60→120→180秒 と延ばす
      #
      # 4回試してもダメな場合、ここを「失敗」で終わらせると GitHub から
      # 失敗メールが届く。しかし実際には
      #   ・data/stocks.json は書き換えられていない（＝データは壊れていない）
      #   ・次の実行で自動的に追いつく
      #   ・データが古いことはサイト側の赤い警告帯で気づける
      # ので、通知する価値がない。警告だけ残して正常終了する。
      - name: 株価データ取得 (fetch_stocks.py)
        id: fetch
        run: |
          WAITS="60 120 180"
          ATTEMPT=1
          for w in $WAITS ""; do
            if python scripts/fetch_stocks.py; then
              echo "取得に成功しました（$ATTEMPT 回目）"
              echo "ok=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ -n "$w" ]; then
              echo "取得に失敗しました — ${w}秒待ってリトライします"
              sleep "$w"
            fi
          done
          echo "::warning::4回試しても株価を取得できませんでした。data/stocks.json は変更していません（次回の実行で自動的に追いつきます）"
          echo "ok=false" >> $GITHUB_OUTPUT

      - name: 変更チェック
        id: check
        if: steps.fetch.outputs.ok == 'true'
        run: |
          if git diff --quiet data/stocks.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: stocks.json をコミット & プッシュ
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git commit -m "chore: 株価データ更新 $(date +'%Y-%m-%d %H:%M JST' -d '+9 hours')"
          # 他の実行が先に push していた場合に備えて取り込んでから再試行する
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push に失敗しました — リトライ $i/3"
            sleep 10
          done
          echo "3回試しても push できませんでした"
          exit 1
