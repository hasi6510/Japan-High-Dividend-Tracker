name: 株価データ 自動更新

on:
  schedule:
    # JST = UTC+9 なので UTC で指定
    - cron: '35 2 * * 1-5'   # 平日 JST 11:35
    - cron: '35 6 * * 1-5'   # 平日 JST 15:35
    - cron: '0 9 * * 1-5'    # 平日 JST 18:00
  workflow_dispatch:           # 手動実行も可

# 実行が重なると git push が衝突するため、同時に1つだけ走らせる
concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # git push に必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: pip install yfinance pandas

      # yfinance は一時的にデータ取得に失敗することがあるため最大3回試す
      - name: 株価データ取得 (fetch_stocks.py)
        run: |
          for i in 1 2 3; do
            python scripts/fetch_stocks.py && exit 0
            echo "取得に失敗しました — リトライ $i/3"
            sleep 30
          done
          echo "3回試しても取得できませんでした"
          exit 1

      - name: 変更チェック
        id: check
        run: |
          if git diff --quiet data/stocks.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: stocks.json をコミット & プッシュ
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git commit -m "chore: 株価データ更新 $(date +'%Y-%m-%d %H:%M JST' -d '+9 hours')"
          # 他の実行が先に push していた場合に備えて取り込んでから再試行する
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push に失敗しました — リトライ $i/3"
            sleep 10
          done
          echo "3回試しても push できませんでした"
          exit 1
